<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2D57"><title>Gerenciar jogos | Altis Games</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script><script src="supabase-config.js" defer></script><script src="admin.js" defer></script></head><body><header class="topbar"><div class="topinner"><a href="index.html" aria-label="Altis Games"><img src="assets/altis-logo-sticker.png" alt="Altis Games"></a><span class="toplabel">PAINEL DE JOGOS</span><button id="logout" class="logout" hidden>Sair ↗</button></div></header><main class="wrap"><section id="login-panel" class="login-panel"><div class="eyebrow">ÁREA RESTRITA</div><h1>Gerenciar <span class="highlight">jogos</span></h1><p>Entre com sua conta administrativa AltiGames.</p><form id="login-form" class="form"><label>E-mail<input id="admin-email" type="email" autocomplete="username" required placeholder="seu@email.com"></label><label>Senha<input id="admin-password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></label><button class="primary" type="submit">Entrar <span>→</span></button></form><p id="login-error" class="feedback" role="alert"></p></section><section id="dashboard" hidden><div class="dashhead"><div><div class="eyebrow">ALTIS GAMES / ADMINISTRAÇÃO</div><h1>Seus <span class="highlight">jogos</span></h1><p>Cadastre, edite e organize os jogos do catálogo.</p></div><span class="pill" id="total-games">0 JOGOS</span></div><div class="layout"><section class="panel"><h2 id="form-title">Adicionar jogo</h2><form id="game-form" class="form"><input id="game-id" type="hidden"><label>Nome do jogo<input id="game-name" required maxlength="120" placeholder="Ex.: Mimicou!"></label><label>Link do jogo<input id="game-link" type="url" placeholder="https://..."></label><label>Imagem do jogo<input id="game-image-file" type="file" accept="image/png,image/jpeg,image/webp"><small>Selecione PNG, JPG ou WebP (até 5 MB). Ao salvar, a imagem será enviada ao Cloudflare R2.</small></label><input id="game-image" type="hidden"><div class="preview" id="image-preview"><span>Prévia do banner</span></div><label>Categorias <small>(separadas por vírgula)</small><input id="game-categories" placeholder="Festa, Desenho, Trivia"></label><div class="formrow"><label>Ordem de exibição<input id="game-order" type="number" min="0" step="1" value="0"></label><label class="toggle"><input id="game-active" type="checkbox" checked><span>Jogo publicado</span></label></div><div class="actions"><button type="submit" id="save" class="primary">Salvar jogo <span>→</span></button><button type="button" id="cancel" class="secondary" hidden>Cancelar edição</button></div><p id="form-feedback" class="feedback" role="status"></p></form></section><section class="panel listing"><div class="listhead"><h2>Jogos cadastrados</h2><button id="refresh" class="secondary">Atualizar ↻</button></div><div id="games-list" class="games-list" aria-live="polite"></div><p id="list-feedback" class="feedback" role="status"></p></section></div></section></main><footer>© Altis Games · Painel administrativo</footer></body></html>
